services:
  - type: web
    name: siliconpath-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: "3001"
      - key: SCRAPER_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://siliconpath.vercel.app
      - key: RATE_LIMIT_MAX
        value: "120"
