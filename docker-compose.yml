version: "3.8"

services:
  # Next.js 14 Frontend & API Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: berojgardegreewala_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_NAME=BerojgarDegreeWala
      - NEXT_PUBLIC_SITE_URL=https://berojgardegreewala.vercel.app
      - DATABASE_URL=postgresql://postgres:postgres_pass_2026@postgres:5432/berojgardegreewala_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: always

  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: berojgardegreewala_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pass_2026
      - POSTGRES_DB=berojgardegreewala_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Redis Cache Container
  redis:
    image: redis:7-alpine
    container_name: berojgardegreewala_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
