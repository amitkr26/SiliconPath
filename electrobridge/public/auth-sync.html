<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SiliconPath Auth Sync Bridge</title>
</head>
<body>
  <script>
    const ALLOWED_ORIGIN_REGEX = /^https:\/\/([a-zA-Z0-9-]+\.)?vercel\.app$/;
    const PRIMARY_ORIGIN = "https://siliconpath.vercel.app";

    function isOriginAllowed(origin) {
      if (origin === window.location.origin) return true;
      if (origin === PRIMARY_ORIGIN) return true;
      return ALLOWED_ORIGIN_REGEX.test(origin) || origin.startsWith("http://localhost:");
    }

    const tokenKey = "sb-aqauempuwmbizqoaolop-auth-token";

    window.addEventListener("message", function(event) {
      if (!isOriginAllowed(event.origin)) {
        console.warn("AuthSync: Blocked message from untrusted origin:", event.origin);
        return;
      }

      const data = event.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "GET_TOKEN") {
        const token = localStorage.getItem(tokenKey);
        event.source.postMessage({
          type: "TOKEN_RESPONSE",
          token: token
        }, event.origin);
      } else if (data.type === "SET_TOKEN") {
        if (data.token) {
          localStorage.setItem(tokenKey, data.token);
        } else {
          localStorage.removeItem(tokenKey);
        }
        event.source.postMessage({
          type: "SET_TOKEN_DONE"
        }, event.origin);
      }
    });

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "SYNC_BRIDGE_READY" }, "*");
    }
  </script>
</body>
</html>
