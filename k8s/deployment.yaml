apiVersion: apps/v1
kind: Deployment
metadata:
  name: berojgardegreewala-frontend
  namespace: production
  labels:
    app: berojgardegreewala-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: berojgardegreewala-frontend
  template:
    metadata:
      labels:
        app: berojgardegreewala-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/amitkr26/berojgardegreewala-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: berojgardegreewala-config
            - secretRef:
                name: berojgardegreewala-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
