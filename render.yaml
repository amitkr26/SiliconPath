# Render deployment for the standalone backend (Phase 6 deployment decision).
#
# Architecture (simplest option that meets the requirements — no queue, no
# microservices, no Redis):
#   - web service: the Express API, built from backend/server/Dockerfile.
#     Health checks hit /health; Render sends SIGTERM on deploys, which the
#     server handles gracefully (drain + exit).
#   - cron job: the SAME Docker image runs the news worker entrypoint on a
#     schedule (06:00 UTC daily, matching the frontend vercel.json schedule).
#     The worker is its own process — it does not need CRON_SECRET (it IS the
#     executor); the guarded server endpoint stays for Vercel-style triggers.
#
# Secrets are NOT committed here. Set SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# SUPABASE_2_URL, SUPABASE_2_SERVICE_ROLE_KEY, ADMIN_PASSWORD,
# ADMIN_HMAC_SECRET, CRON_SECRET, ALLOWED_ORIGINS in the Render dashboard
# (sync: false below).

services:
  - type: web
    name: berojgardegreewala-backend
    runtime: docker
    repo: https://github.com/amitkr26/BerojgarDegreeWala
    dockerfilePath: ./backend/server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_2_URL
        sync: false
      - key: SUPABASE_2_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_HMAC_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://berojgardegreewala.vercel.app,https://electrobridge.vercel.app"

crons:
  - name: news-sync
    schedule: "0 6 * * *"
    dockerCommand: node --import tsx backend/worker/dist/index.js news
    dockerfilePath: ./backend/server/Dockerfile
    dockerContext: .
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false